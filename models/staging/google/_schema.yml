        description: "Patrimônio bruto total do casal no mês, em reais."
      - name: total_patrimonio_liquido
        description: "Patrimônio líquido total do casal no mês, em reais."
      - name: patrimonio_liquido_lucas
        description: "Patrimônio líquido de Lucas no mês, em reais."
      - name: saldo_bradesco_lucas
        description: "Saldo em conta corrente Bradesco (Lucas)."
      - name: saldo_bradesco_investimentos_lucas
        description: "Saldo em investimentos Bradesco (Lucas)."
      - name: saldo_nubank_investimentos_lucas
        description: "Saldo em investimentos Nubank (Lucas)."
      - name: saldo_nubank_cashback_lucas
        description: "Saldo de cashback Nubank (Lucas)."
      - name: saldo_bitcoin_lucas
        description: "Saldo em bitcoin (Lucas)."
      - name: saldo_daycoval_lucas
        description: "Saldo em investimentos Daycoval (Lucas)."
      - name: saldo_avenue_lucas
        description: "Saldo na Avenue (Lucas)."
      - name: saldo_wise_lucas
        description: "Saldo na Wise (Lucas)."
      - name: patrimonio_liquido_jessica
        description: "Patrimônio líquido de Jéssica no mês, em reais."
      - name: saldo_banco_brasil_jessica
        description: "Saldo em conta Banco do Brasil (Jéssica)."
      - name: saldo_sofisa_investimentos_jessica
        description: "Saldo em investimentos Sofisa (Jéssica)."
      - name: saldo_itau_investimentos_jessica
        description: "Saldo em investimentos Itaú (Jéssica)."
      - name: saldo_nubank_investimentos_jessica
        description: "Saldo em investimentos Nubank (Jéssica)."
      - name: saldo_avenue_jessica
        description: "Saldo na Avenue (Jéssica)."
      - name: minha_inflacao
        description: "Inflação pessoal do mês. Vem da planilha em percentual e é dividida por 100 — fração decimal NUMERIC(18,3)."
      - name: ipca
        description: "IPCA do mês. Vem da planilha em percentual e é dividido por 100 — fração decimal NUMERIC(18,3)."
      - name: igpm
        description: "IGP-M do mês. Vem da planilha em percentual e é dividido por 100 — fração decimal NUMERIC(18,3)."
      - name: selic
        description: "Taxa Selic do mês. Vem da planilha em percentual e é dividida por 100 — fração decimal NUMERIC(18,3)."
      - name: cdi
        description: "CDI do mês. Vem da planilha em percentual e é dividido por 100 — fração decimal NUMERIC(18,3)."
      - name: minha_inflacao_acum
        description: "Índice acumulado (base 1) da inflação pessoal, lido pronto da planilha — só troca vírgula por ponto."
      - name: ipca_acum
        description: "Índice acumulado (base 1) do IPCA, lido pronto da planilha — só troca vírgula por ponto."
      - name: igpm_acum
        description: "Índice acumulado (base 1) do IGP-M, lido pronto da planilha — só troca vírgula por ponto."
      - name: selic_acum
        description: "Índice acumulado (base 1) da Selic, lido pronto da planilha — só troca vírgula por ponto."
      - name: cdi_acum
        description: "Índice acumulado (base 1) do CDI, lido pronto da planilha — só troca vírgula por ponto."

