  - name: stg_carteira_classificacao
    description: "Histórico de classificação manual de camada por posição (SCD2), lido de volta da planilha Google (metade de leitura do loop de retroalimentação). A planilha acumula uma linha por mes_base sempre que a camada de um ativo muda. Alimenta o campo `camada` de int_carteira (usado por carteira_lucas_jessica/carteira_deusa) por join as-of na identidade da posição (pessoa, investimento, categoria_investimento, tipo_investimento, instituicao): cada mês da carteira recebe a classificação vigente naquele mês."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês a partir do qual esta classificação passa a valer (data de vigência SCD2). No join as-of, cada linha da carteira no mês M recebe a camada da última classificação com mes_base <= M."
        data_tests:
          - not_null
      - name: pessoa
        description: "Dono do ativo (lucas / jessica / deusa), em minúsculas. Parte da chave de join com a carteira."
        data_tests:
          - not_null
      - name: investimento
        description: "Identificador do ativo (ticker para renda variável; produto normalizado para renda fixa). Parte da chave de join com a carteira."
        data_tests:
          - not_null
      - name: categoria_investimento
        description: "Categoria do investimento (ex.: RENDA FIXA, RENDA VARIÁVEL)."
        data_tests:
          - not_null
      - name: tipo_investimento
        description: "Tipo do investimento (ex.: TÍTULO PÚBLICO, TÍTULO PRIVADO)."
        data_tests:
          - not_null
      - name: instituicao
        description: "Instituição onde o investimento está posicionado."
        data_tests:
          - not_null
      - name: camada
        description: "Camada de alocação do ativo, em minúsculas: reserva, crescimento ou renda."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['RESERVA', 'CRESCIMENTO', 'RENDA', 'RESERVA ESTRATEGICA']

  - name: stg_ajuste
    description: "Histórico de transferências para equilíbrio de despesas proporcional à renda, descontados gastos individuais. Saldos de conta já consideram este valor descontado/recebido no respectivo mês."
    columns:
      - name: mes
        description: "Referente às despesas daquele mês."
        data_tests:
          - not_null
      - name: ajuste_realizado
        description: "Valor de transferência realizado para a pessoa."
        data_tests:
          - not_null
      - name: pessoa
        description: "Recebedor do ajuste realizado."
        data_tests:
          - not_null