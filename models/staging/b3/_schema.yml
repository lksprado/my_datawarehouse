  - name: stg_proventos
    description: "Proventos recebidos na B3 por pessoa, com data de pagamento, tipo de evento, quantidade, preço unitário e valor líquido."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base do provento (derivado do nome do arquivo de origem)."
      - name: pessoa
        description: "Titular que recebeu o provento (deusa, jessica ou lucas), inferido do caminho do arquivo."
      - name: data_pagamento
        description: "Data de pagamento do provento."
      - name: produto
        description: "Ativo que gerou o provento, normalizado em maiúsculas."
      - name: instituicao
        description: "Instituição responsável pelo pagamento, normalizada em maiúsculas."
      - name: tipo_provento
        description: "Tipo do evento (ex.: DIVIDENDO, JUROS SOBRE CAPITAL PRÓPRIO, RENDIMENTO)."
      - name: quantidade
        description: "Quantidade de ativos considerada no cálculo do provento."
      - name: preco_unitario
        description: "Valor do provento por ativo."
      - name: vlr_liquido_brl
        description: "Valor líquido recebido, em reais."
      - name: moeda_ativo
        description: "Moeda do provento (BRL)."

  - name: stg_renda_fixa
    description: "Posições de renda fixa na B3 por pessoa e mês-base, com emissor, indexador, vencimento e valores atualizados (MtM e curva), incluindo backfill Daycoval."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base da posição (derivado do nome do arquivo de origem)."
      - name: pessoa
        description: "Titular da posição (deusa, jessica ou lucas), inferido do caminho do arquivo."
      - name: produto
        description: "Nome do título de renda fixa (ex.: CDB, LCA, LCI), normalizado em maiúsculas."
      - name: instituicao
        description: "Corretora/custodiante onde o título está posicionado, normalizada em maiúsculas."
      - name: emissor
        description: "Instituição emissora do título, normalizada em maiúsculas."
      - name: codigo
        description: "Código identificador do título."
      - name: indexador
        description: "Indexador de rentabilidade (ex.: CDI, IPCA, PREFIXADO)."
      - name: tipo_de_regime
        description: "Regime de tributação/registro do título."
      - name: data_emissao
        description: "Data de emissão do título."
      - name: data_vencimento
        description: "Data de vencimento do título."
      - name: quantidade
        description: "Quantidade total de títulos na posição."
      - name: quantidade_disponivel
        description: "Quantidade disponível."
      - name: quantidade_indisponivel
        description: "Quantidade indisponível (bloqueada/em garantia/etc.)."
      - name: motivo_indisponibilidade
        description: "Motivo da indisponibilidade da quantidade bloqueada, quando houver."
      - name: contraparte
        description: "Contraparte da operação, quando informada."
      - name: preco_atualizado_mtm
        description: "Preço unitário atualizado por marcação a mercado (MtM)."
      - name: vlr_atualizado_mtm
        description: "Valor da posição atualizado por marcação a mercado (MtM), em reais."
      - name: preco_atualizado_curva
        description: "Preço unitário atualizado pela curva do título."
      - name: vlr_atualizado_curva
        description: "Valor da posição atualizado pela curva do título, em reais."
      - name: moeda_ativo
        description: "Moeda do ativo (BRL)."

  - name: stg_tesouro_direto
    description: "Posições de Tesouro Direto por pessoa e mês-base, com código ISIN, indexador, vencimento e valores aplicado, bruto, líquido e atualizado."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base da posição (derivado do nome do arquivo de origem)."
      - name: pessoa
        description: "Titular da posição (deusa, jessica ou lucas), inferido do caminho do arquivo."
      - name: produto
        description: "Nome do título público (ex.: Tesouro Selic, Tesouro IPCA+), normalizado em maiúsculas."
      - name: instituicao
        description: "Corretora/custodiante onde o título está posicionado, normalizada em maiúsculas."
      - name: codigo_isin
        description: "Código ISIN do título público."
      - name: indexador
        description: "Indexador de rentabilidade (ex.: SELIC, IPCA, PREFIXADO)."
      - name: data_vencimento
        description: "Data de vencimento do título."
      - name: quantidade
        description: "Quantidade total de títulos na posição."
      - name: quantidade_disponivel
        description: "Quantidade disponível."
      - name: quantidade_indisponivel
        description: "Quantidade indisponível (bloqueada/em garantia/etc.)."
      - name: motivo_indisponibilidade
        description: "Motivo da indisponibilidade da quantidade bloqueada, quando houver."
      - name: vlr_aplicado
        description: "Valor originalmente aplicado no título, em reais."
      - name: vlr_bruto
        description: "Valor bruto atual da posição, em reais."
      - name: vlr_liquido
        description: "Valor líquido atual da posição (após IR e taxas), em reais."
      - name: vlr_atualizado_brl
        description: "Valor de mercado atualizado da posição, em reais."
      - name: moeda_ativo
        description: "Moeda do ativo (BRL)."
