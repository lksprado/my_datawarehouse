      - name: ticker
        description: "Código de negociação do BDR na B3."
      - name: tipo
        description: "Tipo do ativo conforme classificação da B3."
      - name: escriturador
        description: "Instituição escrituradora do ativo."
      - name: quantidade
        description: "Quantidade total de ativos na posição."
      - name: quantidade_disponivel
        description: "Quantidade disponível para negociação."
      - name: quantidade_indisponivel
