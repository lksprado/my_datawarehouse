version: 2

models:
  - name: stg_acoes
    description: "Posições de ações na B3 por pessoa e mês-base, com ticker, CNPJ da empresa, quantidades e valores de fechamento/atualizado."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base da posição (derivado do nome do arquivo de origem)."
      - name: pessoa
        description: "Titular da posição (deusa, jessica ou lucas), inferido do caminho do arquivo."
      - name: produto
        description: "Nome do produto/ativo conforme extrato da B3, normalizado em maiúsculas."
      - name: instituicao
        description: "Corretora/custodiante onde o ativo está posicionado, normalizada em maiúsculas."
      - name: ticker
        description: "Código de negociação da ação na B3."
      - name: cnpj_empresa
        description: "CNPJ da empresa emissora, apenas dígitos."
      - name: tipo
        description: "Tipo do ativo conforme classificação da B3 (ex.: ON, PN)."
      - name: escriturador
        description: "Instituição escrituradora do ativo."
      - name: quantidade
        description: "Quantidade total de ativos na posição."
      - name: quantidade_disponivel
        description: "Quantidade disponível para negociação."
      - name: quantidade_indisponivel
        description: "Quantidade indisponível (bloqueada/em garantia/etc.)."
      - name: motivo_indisponibilidade
        description: "Motivo da indisponibilidade da quantidade bloqueada, quando houver."
      - name: vlr_fechamento
        description: "Preço de fechamento unitário do ativo no mês-base."
      - name: vlr_atualizado_brl
        description: "Valor de mercado atualizado da posição, em reais."
      - name: moeda_ativo
        description: "Moeda do ativo (BRL)."

