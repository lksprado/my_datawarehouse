      - name: moeda_ativo
        description: "Moeda do ativo (BRL)."

  - name: stg_usd
    description: "Cotação do dólar (USD) no último dia útil de cada mês, com data de referência posicionada no final do mês."
    columns:
      - name: data_referencia
        description: "Último dia do mês de referência (posição usada para conversão cambial mensal)."
      - name: vlr_usd
        description: "Cotação de venda do dólar no último dia útil do mês, em reais."

  - name: stg_de_para_instituicoes_fgc
    description: "De-para entre instituição emissora e o conglomerado financeiro do FGC ao qual pertence, usado para agregar o risco por conglomerado (limite de garantia)."
    columns:
      - name: instituicao
        description: "Nome da instituição emissora, normalizado (sem sufixos societários e pontuação)."
      - name: conglomerado
        description: "Conglomerado financeiro FGC ao qual a instituição pertence."

  - name: stg_datas_especiais
    description: >
      Calendário de datas especiais da família (aniversários e efemérides), vindo do seed
      datas_especiais. Um registro por evento; a data é recorrente por dia+mês, sem ano fixo.
      Consumido por dim_datas, que dele deriva fl_data_especial e fl_mes_especial — as flags que
      permitem ler pico de gasto em `role` e `diversos` como sazonalidade conhecida.
    columns:
      - name: dia
        description: "Dia do mês em que o evento cai (1-31)."
      - name: mes_num
        description: "Mês do evento (1-12)."
      - name: ano_inicio
        description: "Primeiro ano em que o evento passa a valer (ex.: o ano do casamento). Nulo quando o evento vale para toda a série."
      - name: motivo
        description: "Descrição do evento, em maiúsculas."
