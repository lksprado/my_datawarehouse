  - name: patrimonio
    description: >
      Fotografia mensal do patrimônio do casal: um registro por mês-base, com o bruto e o líquido
      totais, o líquido de cada titular e o saldo de cada conta/instituição, em reais. Vem de
      int_patrimonio_mensal, cuja origem é a planilha (raw.patrimonio) — é declarado manualmente,
      não derivado das posições de carteira, e por isso pode divergir de carteira_lucas /
      carteira_jessica em meses em que as duas fontes não fecharam juntas. Para variação use patrimonio_mom, que tem os
      mesmos nomes de coluna com unidade diferente.
