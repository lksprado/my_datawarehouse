      - name: vlr_liquido_brl
        description: "Valor líquido de dividendos/proventos recebidos no mês (0 quando não há recebimento)."
      - name: model_updated_at
        description: "Data/hora em que o dbt materializou esta tabela (current_timestamp da carga, com fuso). Igual em todas as linhas do mart; serve para auditar a atualidade dos dados."

  - name: risco_fgc_lucas
    description: "Exposição ao FGC por conglomerado no mês atual (Lucas), comparando o total investido ao limite de garantia de R$ 250.000 e sinalizando risco."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base avaliado (mês atual da carteira)."
