version: 2

models:
  - name: carteira_lucas
    description: >
      Carteira consolidada do Lucas por mês, com instituição, categoria, tipo, indexador,
      vencimento e valor atualizado. Une as posições de renda fixa e renda variável de int_carteira
      com as disponibilidades em conta de int_carteira_extra (Bradesco, cashback Nubank, Wise e
      Bitcoin), que entram como classe DISPONIBILIDADE e recebem camada pela mesma classificação
      manual dos demais ativos — 'NAO CLASSIFICADO' enquanto não classificadas na planilha. Só
      então filtra pessoa = 'lucas'. Mesmo layout de carteira_jessica e carteira_deusa; os três
      substituíram o antigo carteira_lucas_jessica.
      {{ doc('politica_investimentos') }}
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base da posição (chave de junção com a dimensão de datas)."
      - name: mes_final
        description: "Último dia do mês de referência da posição."
      - name: trimestre
        description: "Trimestre do ano da posição (quarter_of_year da dimensão de datas)."
      - name: ano
        description: "Ano da posição."
      - name: instituicao
        description: "Corretora/custodiante padronizada (ex.: NUBANK, BRADESCO, DAYCOVAL, AVENUE, WISE, AUTOCUSTODIA)."
      - name: emissor
        description: "Instituição emissora do título (apenas renda fixa; nulo em renda variável e disponibilidades)."
      - name: conglomerado
        description: "Conglomerado financeiro FGC do emissor (apenas renda fixa e conta corrente de banco; nulo nos demais)."
      - name: classe_ativo
        description: "Classe do ativo (RENDA FIXA, RENDA VARIAVEL ou DISPONIBILIDADE)."
      - name: tipo_ativo
        description: "Tipo do ativo (ex.: ACAO, FUNDO, TÍTULO PÚBLICO, TÍTULO PRIVADO, CONTA CORRENTE)."
      - name: camada
        description: '{{ doc("camada_investimento") }}'
      - name: ativo
        description: "Nome/identificação do ativo ('SALDO EM CONTA' para as disponibilidades)."
      - name: indexador
        description: "Indexador de rentabilidade (renda fixa e conta corrente remunerada; nulo nos demais)."
      - name: data_vencimento
        description: "Data de vencimento do título (apenas renda fixa; nulo em renda variável e disponibilidades)."
      - name: vencimento_em_dias
        description: "Dias restantes até o vencimento (apenas renda fixa; nulo em renda variável e disponibilidades)."
      - name: vlr_atualizado_brl
        description: "Valor de mercado atualizado da posição, em reais."
      - name: moeda_ativo
        description: "Moeda do ativo (BRL, USD ou BTC)."
      - name: fl_mes_atual
        description: "Indica se a linha pertence ao mês-base mais recente disponível na carteira."
      - name: pessoa
        description: "Titular da posição (lucas)."
      - name: model_updated_at
        description: "Data/hora em que o dbt materializou esta tabela (current_timestamp da carga, com fuso). Igual em todas as linhas do mart; serve para auditar a atualidade dos dados."

