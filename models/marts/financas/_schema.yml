    description: >
      Recorte da Jéssica sobre int_carteira_agregada: totais mensais de valor atualizado com
      uma coluna por instituição. Mesmo caveat de carteira_lucas_agregada — as colunas por
      instituição são listadas manualmente no SELECT, então instituição nova entra em
      total_geral antes de virar coluna própria.
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base de referência (chave de junção com carteira_jessica e com a dimensão de datas)."
      - name: mes_final
        description: "Último dia do mês de referência."
      - name: pessoa
        description: "Sempre 'jessica'."
      - name: total_geral
        description: "Soma de total_investido e total_disponibilidades, equivalente à soma das colunas por instituição."
      - name: total_disponibilidades
        description: "Total do saldo em conta (int_carteira_extra) no mês: o saldo Banco do Brasil da Jéssica."
      - name: total_investido
        description: "Total das posições de investimento (int_carteira) no mês."
      - name: banco_do_brasil
        description: "Total do mês na instituição BANCO DO BRASIL (saldo em conta), em reais."
      - name: sofisa
        description: "Total do mês na instituição SOFISA, em reais."
      - name: itau
        description: "Total do mês na instituição ITAU, em reais."
      - name: nubank
        description: "Total do mês na instituição NUBANK, em reais."
      - name: avenue
        description: "Total do mês na Avenue convertido para reais."
      - name: vlr_liquido_usd
        description: "Saldo Avenue no mês na moeda original (USD), vindo de int_carteira_usd; 0 quando não há posição. NÃO somar com as colunas em reais."
      - name: model_updated_at
        description: "Data/hora em que o dbt materializou esta tabela (current_timestamp da carga, com fuso). Igual em todas as linhas do mart; serve para auditar a atualidade dos dados."

  - name: carteira_deusa_agregada
