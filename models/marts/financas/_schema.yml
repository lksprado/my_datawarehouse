  - name: carteira_lucas_agregada
    description: >
      Recorte do Lucas sobre int_carteira_agregada: totais mensais de valor atualizado com
      uma coluna por instituição. int_carteira_agregada resolve o pivot com a lista de
      instituições dinâmica, mas ESTE mart lista as colunas uma a uma — instituição nova
      passa a existir lá e entra em total_geral aqui, porém só vira coluna própria depois
      de acrescentada ao SELECT. Vale `soma das colunas por instituição = total_geral`
      apenas enquanto a lista estiver completa; carteira_auditoria é a checagem.
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base de referência (chave de junção com carteira_lucas e com a dimensão de datas)."
      - name: mes_final
        description: "Último dia do mês de referência."
      - name: pessoa
        description: "Sempre 'lucas'."
      - name: total_geral
        description: "Soma de total_investido e total_disponibilidades, equivalente à soma das colunas por instituição."
      - name: total_disponibilidades
        description: "Total do saldo em conta (int_carteira_extra) no mês."
      - name: total_investido
        description: "Total das posições de investimento (int_carteira) no mês."
      - name: bradesco
        description: "Total do mês na instituição BRADESCO (investimentos + saldo em conta), em reais."
      - name: nubank
        description: "Total do mês na instituição NUBANK (investimentos + cashback), em reais."
      - name: autocustodia
        description: "Total do mês em AUTOCUSTODIA (bitcoin em carteira própria), em reais."
      - name: daycoval
        description: "Total do mês na instituição DAYCOVAL, em reais."
      - name: avenue
        description: "Total do mês na Avenue convertido para reais."
      - name: wise
        description: "Total do mês na Wise convertido para reais."
      - name: vlr_liquido_usd
        description: "Saldo Avenue no mês na moeda original (USD), vindo de int_carteira_usd; 0 quando não há posição. NÃO somar com as colunas em reais."
      - name: model_updated_at
        description: "Data/hora em que o dbt materializou esta tabela (current_timestamp da carga, com fuso). Igual em todas as linhas do mart; serve para auditar a atualidade dos dados."

