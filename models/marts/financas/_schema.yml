      - name: model_updated_at
        description: "Data/hora em que o dbt materializou esta tabela (current_timestamp da carga, com fuso). Igual em todas as linhas do mart; serve para auditar a atualidade dos dados."

  - name: resultado
    description: >
      DRE mensal do casal, em reais: um registro por mês de débito/competência, com receita aberta
      por origem, despesa aberta pelas oito categorias e o resultado do período (receita − despesa),
      somando Lucas e Jéssica a partir de int_dre_consolidado.
      ATENÇÃO: contém meses futuros pré-lançados, com as despesas fixas recorrentes já agendadas.
      Esses meses não são realizados — filtre por mês de referência antes de calcular médias, taxa
      de poupança ou variação.
      {{ doc('ciclo_fatura') }}
    columns:
      - name: mes_debito
        description: "Primeiro dia do mês de débito/competência. Chave do modelo."
        data_tests:
          - unique
          - not_null
      - name: fl_mes_especial
        description: "1 quando o mês contém alguma data especial de dim_datas; 0 caso contrário."
      - name: motivo
        description: >
          Datas especiais do mês, separadas por ' / ', ou 'NORMAL' quando não há nenhuma.
          Serve para explicar picos sazonais em role e diversos — não afeta os valores.
      - name: trimestre
        description: "Trimestre do ano."
      - name: ano
        description: "Ano de referência."
      - name: total_receita
        description: "Receita total do mês."
      - name: ajuste_realizado
        description: '{{ doc("ajuste") }}'
      - name: total_despesas
        description: "Despesa total do mês."
      - name: resultado
        description: "Resultado do mês (receita total menos despesa total)."
      - name: total_salario
        description: "Receita total de salário no mês."
      - name: total_dividendo
        description: "Receita total de dividendos no mês."
      - name: total_outros
        description: "Outras receitas no mês."
      - name: total_mercado
        description: '{{ doc("categoria_mercado") }}'
      - name: total_diversos
        description: '{{ doc("categoria_diversos") }}'
      - name: total_assinaturas
        description: '{{ doc("categoria_assinaturas") }}'
      - name: total_role
        description: '{{ doc("categoria_role") }}'
      - name: total_transporte
        description: '{{ doc("categoria_transporte") }}'
      - name: total_apartamento
        description: '{{ doc("categoria_apartamento") }}'
      - name: total_saude
        description: '{{ doc("categoria_saude") }}'
      - name: total_educacao
        description: '{{ doc("categoria_educacao") }}'
      - name: model_updated_at
        description: "Data/hora em que o dbt materializou esta tabela (current_timestamp da carga, com fuso). Igual em todas as linhas do mart; serve para auditar a atualidade dos dados."

  - name: luz
    description: >
      Conta de energia do apartamento por mês de referência: valor faturado, consumo em kWh, dias do
      período, consumo médio diário e preço médio por kWh. Serve para separar efeito preço
      (preco_kwh) de efeito consumo (kwh_dia) quando a categoria apartamento sobe.
      É o DETALHAMENTO de uma parcela da categoria `apartamento` em `resultado`/`consumo`, não uma
      categoria à parte — nunca some os dois.
    columns:
      - name: mes
        description: "Primeiro dia do mês de referência da conta."
      - name: trimestre
        description: "Trimestre do ano."
      - name: ano
        description: "Ano de referência."
      - name: vlr_fatura
        description: "Valor total da fatura de energia no mês."
      - name: kwh
        description: "Consumo de energia no período, em kWh."
      - name: dias
        description: "Número de dias do período de faturamento."
      - name: kwh_dia
        description: "Consumo médio diário de energia, em kWh."
      - name: preco_kwh
        description: "Preço médio por kWh no período."
      - name: model_updated_at
        description: "Data/hora em que o dbt materializou esta tabela (current_timestamp da carga, com fuso). Igual em todas as linhas do mart; serve para auditar a atualidade dos dados."
