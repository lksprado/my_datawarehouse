      - name: vlr_liberado
        description: "Valor ainda coberto pela garantia (limite de R$ 250.000 menos o total investido no conglomerado)."
      - name: risco_fgc
        description: "Classificação do risco: 'OK' quando há folga acima de R$ 50.000, 'PERIGO!' caso contrário."
      - name: model_updated_at
        description: "Data/hora em que o dbt materializou esta tabela (current_timestamp da carga, com fuso). Igual em todas as linhas do mart; serve para auditar a atualidade dos dados."

