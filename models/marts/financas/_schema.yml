  - name: patrimonio_mom
    description: >
      Variação mês a mês (MoM) de cada saldo de int_patrimonio_mensal. Um registro por mês-base.
      CUIDADO: as colunas têm exatamente os mesmos nomes de `patrimonio`, mas NÃO são saldos — são
      variações, expressas em FRAÇÃO DECIMAL com 3 casas (0.045 = +4,5%), calculadas como
      valor / LAG(valor) - 1 sobre mes_base. O primeiro mês da série e qualquer mês cujo antecessor
      seja zero ou nulo vêm nulos. Somar ou comparar estas colunas com as de `patrimonio` mistura
      unidades diferentes.
      A variação mistura aporte, rentabilidade e consumo — antes de lê-la como desempenho, confira
      os fatos relevantes das categorias de gasto em `_docs_financas.md`: uma saída de caixa
      planejada derruba o saldo sem que tenha havido perda.
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base de referência."
      - name: total_patrimonio_bruto
        description: "Variação MoM do patrimônio bruto total, em fração decimal."
      - name: total_patrimonio_liquido
        description: "Variação MoM, em fração decimal, do patrimônio líquido total."
      - name: patrimonio_liquido_lucas
        description: "Variação MoM, em fração decimal, do patrimônio líquido de Lucas."
      - name: saldo_bradesco_lucas
        description: "Variação MoM, em fração decimal, do saldo Bradesco (Lucas)."
      - name: saldo_bradesco_investimentos_lucas
        description: "Variação MoM, em fração decimal, dos investimentos Bradesco (Lucas)."
      - name: saldo_nubank_investimentos_lucas
        description: "Variação MoM, em fração decimal, dos investimentos Nubank (Lucas)."
      - name: saldo_nubank_cashback_lucas
        description: "Variação MoM, em fração decimal, do cashback Nubank (Lucas)."
      - name: saldo_bitcoin_lucas
        description: "Variação MoM, em fração decimal, do saldo em bitcoin (Lucas)."
      - name: saldo_daycoval_lucas
        description: "Variação MoM, em fração decimal, dos investimentos Daycoval (Lucas)."
      - name: saldo_avenue_lucas
