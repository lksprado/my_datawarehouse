      - name: total_disponibilidades
        description: "Total do saldo em conta (int_carteira_extra) no mês: Bradesco, Nubank, cashback Nubank e Banco do Brasil da Deusa, vindos de int_patrimonio_mensal_deusa."
      - name: total_investido
        description: "Total das posições de investimento (int_carteira) no mês."
      - name: banco_do_brasil
        description: "Total do mês na instituição BANCO DO BRASIL, em reais."
      - name: bradesco
        description: "Total do mês na instituição BRADESCO, em reais."
      - name: nubank
        description: "Total do mês na instituição NUBANK (investimentos + cashback), em reais."
      - name: avenue
        description: "Total do mês na Avenue convertido para reais."
      - name: vlr_liquido_usd
        description: "Saldo Avenue no mês na moeda original (USD), vindo de int_carteira_usd; 0 quando não há posição. NÃO somar com as colunas em reais."
      - name: model_updated_at
        description: "Data/hora em que o dbt materializou esta tabela (current_timestamp da carga, com fuso). Igual em todas as linhas do mart; serve para auditar a atualidade dos dados."

  - name: carteira_auditoria
    description: >
      Modelo de auditoria da carteira: para cada mês x pessoa, compara o total somado linha a
      linha em carteira_lucas / carteira_jessica / carteira_deusa com o total_geral do
      respectivo mart agregado. As duas rotas partem das mesmas fontes (int_carteira +
      int_carteira_extra), então `dif` deve ser zero em todos os meses — diferente de zero
      denuncia divergência entre o caminho detalhado e o agregado (pivot, filtro por pessoa
      ou join de int_carteira_usd).
      É INNER JOIN: mês x pessoa que exista em só um dos lados some da saída em vez de
      aparecer como divergência.
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base auditado."
      - name: pessoa
        description: "Titular auditado (deusa, jessica ou lucas)."
      - name: total_carteira
        description: "Soma de vlr_atualizado_brl das linhas do mart detalhado da pessoa no mês."
      - name: total_carteira_agregada
        description: "total_geral do mart agregado da pessoa no mês."
      - name: dif
        description: "total_carteira menos total_carteira_agregada. Esperado 0; qualquer outro valor é divergência a investigar."
        data_tests:
          - accepted_values:
              arguments: 
                values: [0]

  - name: carteira_classificacao
    description: "Mart auxiliar de INPUT do loop de classificação: lista os ativos do mês atual (distintos) já com a camada vigente preenchida ('NAO CLASSIFICADO' para os novos). Cobre os investimentos de int_carteira e também as disponibilidades em conta de int_carteira_extra (Bradesco/Nubank cashback/Wise/Bitcoin do Lucas, Banco do Brasil da Jéssica, Bradesco/Nubank/Nubank cashback/Banco do Brasil da Deusa), que seguem a mesma regra dos demais ativos e também chegam como 'NAO CLASSIFICADO' até serem classificadas na planilha. É copiado para a aba 'classificacao' da planilha, onde o Lucas preenche/edita a camada; o ETL do Google lê a aba de volta para raw.carteira_classificacao, fechando o loop de retroalimentação."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base da posição — o mes_base que o Lucas registra na planilha ao classificar ou reclassificar."
      - name: pessoa
        description: "Dono do ativo (deusa, jessica ou lucas)."
      - name: ativo
        description: "Identificador do ativo (ticker para RV; produto normalizado para RF; 'SALDO EM CONTA' para as disponibilidades). Chave que o Lucas usa para classificar."
      - name: indexador
        description: "Indexador de rentabilidade vigente (renda fixa e contas remuneradas); nulo nos demais."
      - name: classe_ativo
        description: "RENDA FIXA, RENDA VARIAVEL ou DISPONIBILIDADE — contexto para a classificação manual."
      - name: tipo_ativo
        description: "Tipo do ativo (ACAO, FUNDO, TITULO PUBLICO, TITULO PRIVADO, CONTA CORRENTE)."
      - name: instituicao
        description: >
          Instituição/corretora onde o ativo é mantido. Junto com pessoa, é o que distingue as
          linhas de 'SALDO EM CONTA'. ATENÇÃO: o saldo em conta e o cashback Nubank da Deusa têm
          pessoa, instituicao e ativo idênticos, então o SELECT DISTINCT os colapsa numa linha só
          — as duas posições de carteira_deusa compartilham a mesma classificação de camada.
      - name: data_vencimento
        description: "Data de vencimento do título (apenas renda fixa); nula nos demais."
      - name: camada
        description: "Camada vigente do ativo ou 'NAO CLASSIFICADO' se ainda não classificado — os brancos que o Lucas deve preencher na planilha. Nenhuma camada é inferida pelo modelo: tanto os investimentos de int_carteira quanto as disponibilidades de int_carteira_extra (saldo Bradesco/Wise/Bitcoin/BB) chegam como 'NAO CLASSIFICADO' até receberem classificação manual. Ver o bloco camada_investimento em _docs_financas.md para o significado de cada camada."

  - name: dividendos
    description: "Série mensal de renda passiva por pessoa, com spine de datas contínuo entre o primeiro e o último mês com dividendos (zero quando não há recebimento)."
    columns:
