version: 2

models:
  - name: carteira_lucas_jessica
    description: >
      Carteira consolidada do casal (Lucas e Jéssica) por mês, com instituição, categoria, tipo,
      indexador, vencimento e valor atualizado por pessoa. Une as posições de renda fixa e renda
      variável de int_carteira com as disponibilidades em conta derivadas de int_ativos_agregado
      (Bradesco, Wise e Bitcoin do Lucas; Banco do Brasil da Jéssica), que entram como categoria
      DISPONIBILIDADE / camada RESERVA ESTRATEGICA. Só então filtra pessoa IN ('lucas', 'jessica');
      Deusa fica em carteira_deusa.
      {{ doc('politica_investimentos') }}
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base da posição (chave de junção com a dimensão de datas)."
      - name: mes_final
        description: "Último dia do mês de referência da posição."
      - name: trimestre
        description: "Trimestre do ano da posição (quarter_of_year da dimensão de datas)."
      - name: ano
        description: "Ano da posição."
      - name: instituicao
        description: "Corretora/custodiante padronizada (ex.: NUBANK, BRADESCO, DAYCOVAL, AVENUE, WISE, AUTOCUSTODIA)."
      - name: emissor
        description: "Instituição emissora do título (apenas renda fixa; nulo em renda variável e disponibilidades)."
      - name: conglomerado
        description: "Conglomerado financeiro FGC do emissor (apenas renda fixa e conta corrente de banco; nulo nos demais)."
      - name: categoria_investimento
        description: "Categoria do investimento (RENDA FIXA, RENDA VARIAVEL ou DISPONIBILIDADE)."
      - name: tipo_investimento
        description: "Tipo do investimento (ex.: ACAO, FUNDO, TÍTULO PÚBLICO, TÍTULO PRIVADO, CONTA CORRENTE)."
      - name: camada
        description: '{{ doc("camada_investimento") }}'
      - name: investimento
        description: "Nome/identificação do investimento ('SALDO EM CONTA' para as disponibilidades)."
      - name: indexador
        description: "Indexador de rentabilidade (renda fixa e conta corrente remunerada; nulo nos demais)."
      - name: data_vencimento
        description: "Data de vencimento do título (apenas renda fixa; nulo em renda variável e disponibilidades)."
      - name: vencimento_em_dias
        description: "Dias restantes até o vencimento (apenas renda fixa; nulo em renda variável e disponibilidades)."
      - name: vlr_atualizado_brl
        description: "Valor de mercado atualizado da posição, em reais."
      - name: moeda_ativo
        description: "Moeda do ativo (BRL, USD ou BTC)."
      - name: fl_mes_atual
        description: "Indica se a linha pertence ao mês-base mais recente disponível na carteira."
      - name: pessoa
        description: "Titular da posição (jessica ou lucas)."

  - name: carteira_deusa
    description: >
      Carteira consolidada de investimentos de Deusa por mês (renda fixa e renda variável); 
      mesmo layout de carteira_lucas_jessica, filtrando pessoa = 'deusa' a partir de int_carteira.
      {{ doc('politica_investimentos') }}
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base da posição (chave de junção com a dimensão de datas)."
      - name: mes_final
        description: "Último dia do mês de referência da posição."
      - name: trimestre
        description: "Trimestre do ano da posição."
      - name: ano
        description: "Ano da posição."
      - name: instituicao
        description: "Corretora/custodiante padronizada."
      - name: emissor
        description: "Instituição emissora do título (apenas renda fixa)."
      - name: conglomerado
        description: "Conglomerado financeiro FGC do emissor (apenas renda fixa)."
      - name: categoria_investimento
        description: "Categoria do investimento (RENDA FIXA ou RENDA VARIAVEL)."
      - name: tipo_investimento
        description: "Tipo do investimento."
      - name: camada
        description: '{{ doc("camada_investimento") }}'
      - name: investimento
        description: "Nome/identificação do investimento."
      - name: indexador
        description: "Indexador de rentabilidade (apenas renda fixa)."
      - name: data_vencimento
        description: "Data de vencimento do título (apenas renda fixa)."
      - name: vencimento_em_dias
        description: "Dias restantes até o vencimento (apenas renda fixa)."
      - name: vlr_atualizado_brl
        description: "Valor de mercado atualizado da posição, em reais."
      - name: moeda_ativo
        description: "Moeda do ativo (BRL ou USD)."
      - name: fl_mes_atual
        description: "Indica se a linha pertence ao mês-base mais recente disponível na carteira."
      - name: pessoa
        description: "Titular da posição (deusa)."

  - name: carteira_lucas_agregada
    description: "Totais mensais de valor atualizado pivotados por instituição (uma coluna por instituição, gerada dinamicamente a partir de int_carteira) para Lucas."
    columns:
      - name: mes_final
        description: "Último dia do mês de referência."
      - name: total_investido
        description: "Total investido no mês, somando as instituições (bradesco, nubank, daycoval, avenue)."
      - name: bradesco
        description: "Total investido na Bradesco no mês."
      - name: nubank
        description: "Total investido na Nubank no mês."
      - name: daycoval
        description: "Total investido na Daycoval no mês."
      - name: avenue
        description: "Total investido na Avenue no mês."
    # Observação: as colunas por instituição são geradas dinamicamente (dbt_utils.pivot);
    # instituições novas viram colunas automaticamente no próximo dbt run.

  - name: carteira_jessica_agregada
    description: "Totais mensais de valor atualizado pivotados por instituição (uma coluna por instituição, gerada dinamicamente a partir de int_carteira) para Jéssica."
    columns:
      - name: mes_final
        description: "Último dia do mês de referência."
      - name: total_investido
        description: "Total investido no mês, somando as instituições (sofisa, itau, nubank, avenue)."
      - name: sofisa
        description: "Total investido na Sofisa no mês."
      - name: itau
        description: "Total investido no Itaú no mês."
      - name: nubank
        description: "Total investido na Nubank no mês."
      - name: avenue
        description: "Total investido na Avenue no mês."
    # Observação: as colunas por instituição são geradas dinamicamente (dbt_utils.pivot);
    # instituições novas viram colunas automaticamente no próximo dbt run.

  - name: carteira_deusa_agregada
    description: "Totais mensais de valor atualizado pivotados por instituição (uma coluna por instituição, gerada dinamicamente a partir de int_carteira) para Deusa."
    columns:
      - name: mes_final
        description: "Último dia do mês de referência."
      - name: total_investido
        description: "Total investido no mês, somando as instituições (banco_do_brasil, bradesco, nubank, avenue)."
      - name: banco_do_brasil
        description: "Total investido no Banco do Brasil no mês."
      - name: bradesco
        description: "Total investido na Bradesco no mês."
      - name: nubank
        description: "Total investido na Nubank no mês."
      - name: avenue
        description: "Total investido na Avenue no mês."
    # Observação: as colunas por instituição são geradas dinamicamente (dbt_utils.pivot);
    # instituições novas viram colunas automaticamente no próximo dbt run.

  - name: carteira_classificacao
    description: "Mart auxiliar de INPUT do loop de classificação: lista os ativos do mês atual (distintos) já com a camada vigente preenchida ('NAO CLASSIFICADO' para os novos). É copiado para a aba 'classificacao' da planilha, onde o Lucas preenche/edita a camada; o ETL do Google lê a aba de volta para raw.carteira_classificacao, fechando o loop de retroalimentação."
    columns:
      - name: pessoa
        description: "Dono do ativo (deusa, jessica ou lucas)."
      - name: investimento
        description: "Identificador do ativo (ticker para RV; produto normalizado para RF). Chave que o Lucas usa para classificar."
      - name: categoria_investimento
        description: "RENDA FIXA ou RENDA VARIAVEL — contexto para a classificação manual."
      - name: tipo_investimento
        description: "Tipo do ativo (ACAO, FUNDO, TITULO PUBLICO, TITULO PRIVADO)."
      - name: instituicao
        description: "Instituição/corretora onde o ativo é mantido."
      - name: camada
        description: "Camada vigente do ativo (reserva/crescimento/renda) ou 'NAO CLASSIFICADO' se ainda não classificado — os brancos que o Lucas deve preencher na planilha."

  - name: dividendos
    description: "Série mensal de renda passiva por pessoa, com spine de datas contínuo entre o primeiro e o último mês com dividendos (zero quando não há recebimento)."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês de referência."
      - name: ano
        description: "Ano do mês de referência."
      - name: trimestre
        description: "Trimestre do ano de referência."
      - name: pessoa
        description: "Titular que recebeu os dividendos (deusa, jessica ou lucas)."
      - name: vlr_liquido_brl
        description: "Valor líquido de dividendos/proventos recebidos no mês (0 quando não há recebimento)."

  - name: risco_fgc_lucas
    description: "Exposição ao FGC por conglomerado no mês atual (Lucas), comparando o total investido ao limite de garantia de R$ 250.000 e sinalizando risco."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base avaliado (mês atual da carteira)."
      - name: conglomerado
        description: "Conglomerado financeiro FGC avaliado."
      - name: vlr_liberado
        description: "Valor ainda coberto pela garantia (limite de R$ 250.000 menos o total investido no conglomerado)."
      - name: risco_fgc
        description: "Classificação do risco: 'OK' quando há folga acima de R$ 50.000, 'PERIGO!' caso contrário."

  - name: risco_fgc_deusa
    description: "Exposição ao FGC por conglomerado no mês atual (Deusa), comparando o total investido ao limite de garantia de R$ 250.000 e sinalizando risco."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base avaliado (mês atual da carteira)."
      - name: conglomerado
        description: "Conglomerado financeiro FGC avaliado."
      - name: vlr_liberado
        description: "Valor ainda coberto pela garantia (limite de R$ 250.000 menos o total investido no conglomerado)."
      - name: risco_fgc
        description: "Classificação do risco: 'OK' quando há folga acima de R$ 1.000, 'PERIGO!' caso contrário."

  - name: risco_fgc_jessica
    description: "Exposição ao FGC por conglomerado no mês atual (Jéssica), comparando o total investido ao limite de garantia de R$ 250.000 e sinalizando risco."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base avaliado (mês atual da carteira)."
      - name: conglomerado
        description: "Conglomerado financeiro FGC avaliado."
      - name: vlr_liberado
        description: "Valor ainda coberto pela garantia (limite de R$ 250.000 menos o total investido no conglomerado)."
      - name: risco_fgc
        description: "Classificação do risco: 'OK' quando há folga acima de R$ 1.000, 'PERIGO!' caso contrário."

  - name: verificar_fgc
    description: "Modelo de auditoria: lista emissores de CDB/LCA/LCI/LC ainda sem conglomerado FGC mapeado. Saída vazia significa que o de-para está completo."
    columns:
      - name: emissor
        description: "Emissor de renda fixa sem conglomerado FGC associado."
      - name: conglomerado
        description: "Conglomerado FGC (sempre nulo nesta saída — é justamente o que precisa ser mapeado)."

  - name: ativos_mom
    description: "Variação Month over Month dos ativos"
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base de referência."
      - name: total_patrimonio_bruto
        description: "Variação percentual mês a mês do patrimônio bruto total."
      - name: total_patrimonio_liquido
        description: "Variação percentual mês a mês do patrimônio líquido total."
      - name: patrimonio_liquido_lucas
        description: "Variação percentual mês a mês do patrimônio líquido de Lucas."
      - name: saldo_bradesco_lucas
        description: "Variação percentual mês a mês do saldo Bradesco (Lucas)."
      - name: saldo_bradesco_investimentos_lucas
        description: "Variação percentual mês a mês dos investimentos Bradesco (Lucas)."
      - name: saldo_nubank_investimentos_lucas
        description: "Variação percentual mês a mês dos investimentos Nubank (Lucas)."
      - name: saldo_nubank_cashback_lucas
        description: "Variação percentual mês a mês do cashback Nubank (Lucas)."
      - name: saldo_bitcoin_lucas
        description: "Variação percentual mês a mês do saldo em bitcoin (Lucas)."
      - name: saldo_daycoval_lucas
        description: "Variação percentual mês a mês dos investimentos Daycoval (Lucas)."
      - name: saldo_avenue_lucas
        description: "Variação percentual mês a mês do saldo Avenue (Lucas)."
      - name: saldo_wise_lucas
        description: "Variação percentual mês a mês do saldo Wise (Lucas)."
      - name: patrimonio_liquido_jessica
        description: "Variação percentual mês a mês do patrimônio líquido de Jéssica."
      - name: saldo_banco_brasil_jessica
        description: "Variação percentual mês a mês do saldo Banco do Brasil (Jéssica)."
      - name: saldo_sofisa_investimentos_jessica
        description: "Variação percentual mês a mês dos investimentos Sofisa (Jéssica)."
      - name: saldo_itau_investimentos_jessica
        description: "Variação percentual mês a mês dos investimentos Itaú (Jéssica)."
      - name: saldo_nubank_investimentos_jessica
        description: "Variação percentual mês a mês dos investimentos Nubank (Jéssica)."
      - name: saldo_avenue_jessica
        description: "Variação percentual mês a mês do saldo Avenue (Jéssica)."

  - name: ativos
    description: "Saldos das contas que contabiliza os ativos"
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base de referência."
      - name: mes_final
        description: "Último dia do mês de referência."
      - name: trimestre
        description: "Trimestre do ano de referência."
      - name: ano
        description: "Ano de referência."
      - name: fl_mes_atual
        description: "Indica se a linha pertence ao mês-base mais recente disponível em stg_ativos."
      - name: total_patrimonio_bruto
        description: "Patrimônio bruto total do casal no mês."
      - name: total_patrimonio_liquido
        description: "Patrimônio líquido total do casal no mês."
      - name: patrimonio_liquido_lucas
        description: "Patrimônio líquido de Lucas no mês."
      - name: saldo_bradesco_lucas
        description: "Saldo em conta corrente Bradesco (Lucas)."
      - name: saldo_bradesco_investimentos_lucas
        description: "Saldo em investimentos Bradesco (Lucas)."
      - name: saldo_nubank_investimentos_lucas
        description: "Saldo em investimentos Nubank (Lucas)."
      - name: saldo_nubank_cashback_lucas
        description: "Saldo de cashback Nubank (Lucas)."
      - name: saldo_bitcoin_lucas
        description: "Saldo em bitcoin (Lucas)."
      - name: saldo_daycoval_lucas
        description: "Saldo em investimentos Daycoval (Lucas)."
      - name: saldo_avenue_lucas
        description: "Saldo na Avenue (Lucas)."
      - name: saldo_wise_lucas
        description: "Saldo na Wise (Lucas)."
      - name: patrimonio_liquido_jessica
        description: "Patrimônio líquido de Jéssica no mês."
      - name: saldo_banco_brasil_jessica
        description: "Saldo em conta Banco do Brasil (Jéssica)."
      - name: saldo_sofisa_investimentos_jessica
        description: "Saldo em investimentos Sofisa (Jéssica)."
      - name: saldo_itau_investimentos_jessica
        description: "Saldo em investimentos Itaú (Jéssica)."
      - name: saldo_nubank_investimentos_jessica
        description: "Saldo em investimentos Nubank (Jéssica)."
      - name: saldo_avenue_jessica
        description: "Saldo na Avenue (Jéssica)."

  - name: riqueza
    description: "Compara mês a mês o crescimento acumulado do patrimônio líquido (composto a partir das variações MoM de ativos_mom, a partir de 2023-11) contra os índices acumulados de int_indexadores, classificando cada mês como RICO(S) ou POBRE(S) por indexador."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base de referência."
      - name: total_patrimonio_liquido_acum
        description: "Índice acumulado (base 1) do patrimônio líquido total do casal, composto via EXP(SUM(LN(1+variação MoM)))."
      - name: patrimonio_liquido_lucas_acum
        description: "Índice acumulado (base 1) do patrimônio líquido de Lucas, composto via EXP(SUM(LN(1+variação MoM)))."
      - name: patrimonio_liquido_jessica_acum
        description: "Índice acumulado (base 1) do patrimônio líquido de Jéssica, composto via EXP(SUM(LN(1+variação MoM)))."
      - name: minha_inflacao_acum
        description: "Índice acumulado (base 1) da inflação pessoal, vindo de int_indexadores."
      - name: ipca_acum
        description: "Índice acumulado (base 1) do IPCA, vindo de int_indexadores."
      - name: igpm_acum
        description: "Índice acumulado (base 1) do IGP-M, vindo de int_indexadores."
      - name: selic_acum
        description: "Índice acumulado (base 1) da Selic, vindo de int_indexadores."
      - name: cdi_acum
        description: "Índice acumulado (base 1) do CDI, vindo de int_indexadores."
      - name: comparativo_minha_inflacao_total_liquido
        description: "'RICOS' quando o índice do patrimônio total supera o da inflação pessoal no mês; 'POBRES' caso contrário."
      - name: comparativo_minha_inflacao_lucas
        description: "'RICO' quando o índice do patrimônio de Lucas supera o da inflação pessoal no mês; 'POBRE' caso contrário."
      - name: comparativo_minha_inflacao_jessica
        description: "'RICO' quando o índice do patrimônio de Jéssica supera o da inflação pessoal no mês; 'POBRE' caso contrário."
      - name: comparativo_ipca_total_liquido
        description: "'RICOS' quando o índice do patrimônio total supera o do IPCA no mês; 'POBRES' caso contrário."
      - name: comparativo_ipca_lucas
        description: "'RICO' quando o índice do patrimônio de Lucas supera o do IPCA no mês; 'POBRE' caso contrário."
      - name: comparativo_ipca_jessica
        description: "'RICO' quando o índice do patrimônio de Jéssica supera o do IPCA no mês; 'POBRE' caso contrário."
      - name: comparativo_igpm_total_liquido
        description: "'RICOS' quando o índice do patrimônio total supera o do IGP-M no mês; 'POBRES' caso contrário."
      - name: comparativo_igpm_lucas
        description: "'RICO' quando o índice do patrimônio de Lucas supera o do IGP-M no mês; 'POBRE' caso contrário."
      - name: comparativo_igpm_jessica
        description: "'RICO' quando o índice do patrimônio de Jéssica supera o do IGP-M no mês; 'POBRE' caso contrário."
      - name: comparativo_selic_total_liquido
        description: "'RICOS' quando o índice do patrimônio total supera o da Selic no mês; 'POBRES' caso contrário."
      - name: comparativo_selic_lucas
        description: "'RICO' quando o índice do patrimônio de Lucas supera o da Selic no mês; 'POBRE' caso contrário."
      - name: comparativo_selic_jessica
        description: "'RICO' quando o índice do patrimônio de Jéssica supera o da Selic no mês; 'POBRE' caso contrário."
      - name: comparativo_cdi_total_liquido
        description: "'RICOS' quando o índice do patrimônio total supera o do CDI no mês; 'POBRES' caso contrário."
      - name: comparativo_cdi_lucas
        description: "'RICO' quando o índice do patrimônio de Lucas supera o do CDI no mês; 'POBRE' caso contrário."
      - name: comparativo_cdi_jessica
        description: "'RICO' quando o índice do patrimônio de Jéssica supera o do CDI no mês; 'POBRE' caso contrário."

  - name: consumo
    description: "Consumo diário débito e crédito por dia"
    columns:
      - name: mes
        description: "Primeiro dia do mês de débito/competência."
      - name: data
        description: "Data do lançamento/consumo."
      - name: fl_data_especial
        description: "Flag de uma data especial de aniversário"
      - name: fl_mes_especial
        description: "Flag de um mês com data especial de aniversário"
      - name: dia_nome
        description: "Nome do dia da semana."
      - name: dia_fatura
        description: "Dia ajustado ao ciclo da fatura."
      - name: dia_ano
        description: "Dia real do calendário."
      - name: dia_mes
        description: "Dia do mês (day_of_month da dimensão de datas)."
      - name: semana
        description: "Semana do ano (week_of_year da dimensão de datas)."
      - name: trimestre
        description: "Trimestre do ano."
      - name: total_mercado
        description: '{{ doc("categoria_mercado") }}'
      - name: total_diversos
        description: '{{ doc("categoria_diversos") }}'
      - name: total_assinaturas
        description: '{{ doc("categoria_assinaturas") }}'
      - name: total_role
        description: '{{ doc("categoria_role") }}'
      - name: total_transporte
        description: '{{ doc("categoria_transporte") }}'
      - name: total_apartamento
        description: '{{ doc("categoria_apartamento") }}'
      - name: total_saude
        description: '{{ doc("categoria_saude") }}'
      - name: total_educacao
        description: '{{ doc("categoria_educacao") }}'

  - name: resultado
    description: "Receita x Despesas e tipos de despesas"
    columns:
      - name: mes_debito
        description: "Primeiro dia do mês de débito/competência."
      - name: trimestre
        description: "Trimestre do ano."
      - name: ano
        description: "Ano de referência."
      - name: total_receita
        description: "Receita total do mês."
      - name: ajuste_realizado
        description: '{{ doc("ajuste") }}'
      - name: total_despesas
        description: "Despesa total do mês."
      - name: resultado
        description: "Resultado do mês (receita total menos despesa total)."
      - name: total_salario
        description: "Receita total de salário no mês."
      - name: total_dividendo
        description: "Receita total de dividendos no mês."
      - name: total_outros
        description: "Outras receitas no mês."
      - name: total_mercado
        description: '{{ doc("categoria_mercado") }}'
      - name: total_diversos
        description: '{{ doc("categoria_diversos") }}'
      - name: total_assinaturas
        description: '{{ doc("categoria_assinaturas") }}'
      - name: total_role
        description: '{{ doc("categoria_role") }}'
      - name: total_transporte
        description: '{{ doc("categoria_transporte") }}'
      - name: total_apartamento
        description: '{{ doc("categoria_apartamento") }}'
      - name: total_saude
        description: '{{ doc("categoria_saude") }}'
      - name: total_educacao
        description: '{{ doc("categoria_educacao") }}'

  - name: luz
    description: "Dados da conta de Luz"
    columns:
      - name: mes
        description: "Primeiro dia do mês de referência da conta."
      - name: trimestre
        description: "Trimestre do ano."
      - name: ano
        description: "Ano de referência."
      - name: vlr_fatura
        description: "Valor total da fatura de energia no mês."
      - name: kwh
