version: 2

models:
  - name: int_patrimonio_mensal
    description: "Consolida o patrimônio mensal a partir de stg_patrimonio, expondo patrimônio bruto e líquido e saldos por conta/instituição de Lucas e Jéssica, ordenado por mês-base. Faz join com dim_datas para trazer mês final, trimestre e ano, e sinaliza o mês mais recente disponível. Consumido por patrimonio, patrimonio_mom e pelos CTEs de disponibilidade de carteira_lucas_jessica. Os indexadores macroeconômicos ficam em int_indexadores."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base de referência do patrimônio (chave de junção com a dimensão de datas)."
      - name: mes_final
        description: "Último dia do mês de referência."
      - name: trimestre
        description: "Trimestre do ano de referência (quarter_of_year da dimensão de datas)."
      - name: ano
        description: "Ano de referência."
      - name: fl_mes_atual
        description: "Indica se a linha pertence ao mês-base mais recente disponível em stg_patrimonio."
      - name: total_patrimonio_bruto
        description: "Patrimônio bruto total do casal no mês."
      - name: total_patrimonio_liquido
        description: "Patrimônio líquido total do casal no mês."
      - name: patrimonio_liquido_lucas
        description: "Patrimônio líquido de Lucas no mês."
      - name: saldo_bradesco_lucas
        description: "Saldo em conta corrente Bradesco (Lucas)."
      - name: saldo_bradesco_investimentos_lucas
        description: "Saldo em investimentos Bradesco (Lucas)."
      - name: saldo_nubank_investimentos_lucas
        description: "Saldo em investimentos Nubank (Lucas)."
      - name: saldo_nubank_cashback_lucas
        description: "Saldo de cashback Nubank (Lucas)."
      - name: saldo_bitcoin_lucas
        description: "Saldo em bitcoin (Lucas)."
      - name: saldo_daycoval_lucas
        description: "Saldo em investimentos Daycoval (Lucas)."
      - name: saldo_avenue_lucas
        description: "Saldo na Avenue (Lucas)."
      - name: saldo_wise_lucas
        description: "Saldo na Wise (Lucas)."
      - name: patrimonio_liquido_jessica
        description: "Patrimônio líquido de Jéssica no mês."
      - name: saldo_banco_brasil_jessica
        description: "Saldo em conta Banco do Brasil (Jéssica)."
      - name: saldo_sofisa_investimentos_jessica
        description: "Saldo em investimentos Sofisa (Jéssica)."
      - name: saldo_itau_investimentos_jessica
        description: "Saldo em investimentos Itaú (Jéssica)."
      - name: saldo_nubank_investimentos_jessica
        description: "Saldo em investimentos Nubank (Jéssica)."
      - name: saldo_avenue_jessica
        description: "Saldo na Avenue (Jéssica)."
      - name: vlr_carro
        description: "Valor de mercado do carro segundo a Fipe"

  - name: int_carteira
    description: "Carteira consolidada de investimentos por mês (união de int_renda_variavel e int_renda_fixa), com camada de alocação aplicada via join as-of (SCD2) contra stg_carteira_classificacao e flag do mês mais recente disponível. Base única para todos os marts de carteira (carteira_lucas_jessica, carteira_deusa, carteira_classificacao, risco_fgc_*, carteira_*_agregada) — materializado como table por ser fortemente reutilizado a jusante."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base da posição (chave de junção com a dimensão de datas)."
      - name: mes_final
        description: "Último dia do mês de referência da posição."
      - name: trimestre
        description: "Trimestre do ano da posição (quarter_of_year da dimensão de datas)."
      - name: ano
        description: "Ano da posição."
      - name: instituicao
        description: "Corretora/custodiante padronizada."
      - name: emissor
        description: "Instituição emissora do título (apenas renda fixa)."
      - name: conglomerado
        description: "Conglomerado financeiro FGC do emissor (apenas renda fixa)."
      - name: classe_ativo
        description: "Classe do ativo (RENDA FIXA ou RENDA VARIAVEL)."
      - name: tipo_ativo
        description: "Tipo do ativo (ex.: ACAO, FUNDO, TÍTULO PÚBLICO, TÍTULO PRIVADO)."
      - name: camada
        description: "Camada de alocação (RESERVA/CRESCIMENTO/RENDA) classificada manualmente na planilha e lida de volta via stg_carteira_classificacao, aplicada por join as-of (SCD2) na identidade da posição (pessoa, ativo, classe_ativo, tipo_ativo, instituicao): cada mês recebe a classificação vigente naquele mês (última com mes_base <= o mês da posição). Meses anteriores à primeira classificação ficam como 'NAO CLASSIFICADO'."
      - name: ativo
        description: "Nome/identificação do ativo."
      - name: indexador
        description: "Indexador de rentabilidade (apenas renda fixa)."
      - name: data_vencimento
        description: "Data de vencimento do título (apenas renda fixa)."
      - name: vencimento_em_dias
        description: "Dias restantes até o vencimento (apenas renda fixa)."
      - name: vlr_atualizado_brl
        description: "Valor de mercado atualizado da posição, em reais."
      - name: moeda_ativo
        description: "Moeda do ativo (BRL ou USD)."
      - name: fl_mes_atual
        description: "Indica se a linha pertence ao mês-base mais recente disponível na carteira."
      - name: pessoa
        description: "Titular da posição (deusa, jessica ou lucas)."

  - name: int_carteira_extra
    description: "Disponibilidades em conta derivadas de int_patrimonio_mensal (saldo Bradesco, Wise e Bitcoin do Lucas; Banco do Brasil da Jéssica) expostas no mesmo layout e na mesma ordem de colunas de int_carteira, para que os dois possam ser unidos por posição a jusante (carteira_lucas_jessica, carteira_classificacao). A camada usa o mesmo join as-of (SCD2) contra stg_carteira_classificacao de int_carteira, mas com fallback 'RESERVA ESTRATEGICA' em vez de 'NAO CLASSIFICADO', porque saldo em conta já tem camada natural e não deve aparecer como pendência na planilha."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base do saldo (chave de junção com a dimensão de datas)."
      - name: mes_final
        description: "Último dia do mês de referência."
      - name: trimestre
        description: "Trimestre do ano de referência."
      - name: ano
        description: "Ano de referência."
      - name: instituicao
        description: "Instituição onde o saldo é mantido (BRADESCO, WISE, AUTOCUSTODIA ou BANCO DO BRASIL)."
      - name: emissor
        description: "Sempre nulo — não se aplica a disponibilidades."
      - name: conglomerado
        description: "Conglomerado financeiro FGC quando o saldo está em banco (BRADESCO, BANCO DO BRASIL); nulo para Wise e autocustódia."
      - name: classe_ativo
        description: "Sempre 'DISPONIBILIDADE'."
      - name: tipo_ativo
        description: "Sempre 'CONTA CORRENTE'."
      - name: camada
        description: "Camada de alocação vigente, resolvida por join as-of contra stg_carteira_classificacao na identidade da posição (pessoa, ativo, classe_ativo, tipo_ativo, instituicao); 'RESERVA ESTRATEGICA' enquanto não houver classificação manual na planilha."
      - name: ativo
        description: "Sempre 'SALDO EM CONTA' — as quatro linhas se distinguem por pessoa + instituicao."
      - name: indexador
        description: "'TIR' para as contas remuneradas de banco (Bradesco, Banco do Brasil); nulo para Wise e bitcoin, salvo se preenchido na planilha de classificação."
      - name: data_vencimento
        description: "Sempre nulo — não se aplica a disponibilidades."
      - name: vencimento_em_dias
        description: "Sempre nulo — não se aplica a disponibilidades."
      - name: vlr_atualizado_brl
        description: "Saldo do mês, em reais."
      - name: moeda_ativo
        description: "Moeda de origem do saldo (BRL, USD ou BTC)."
      - name: fl_mes_atual
        description: "Indica se a linha pertence ao mês-base mais recente disponível em stg_patrimonio (herdado de int_patrimonio_mensal — pode divergir do fl_mes_atual de int_carteira se as duas fontes estiverem dessincronizadas)."
      - name: pessoa
        description: "Titular do saldo (jessica ou lucas)."

  - name: int_indexadores
    description: "Isola os indexadores macroeconômicos mensais vindos de stg_patrimonio — taxas do mês e índices acumulados de minha inflação, IPCA, IGP-M, Selic e CDI. Serve de referência de comparação para o mart riqueza."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base de referência."
      - name: minha_inflacao
        description: "Inflação pessoal do mês, em fração decimal."
      - name: ipca
        description: "IPCA do mês, em fração decimal."
      - name: igpm
        description: "IGP-M do mês, em fração decimal."
      - name: selic
        description: "Taxa Selic do mês, em fração decimal."
      - name: cdi
        description: "CDI do mês, em fração decimal."
      - name: minha_inflacao_acum
        description: "Índice acumulado (base 1) da inflação pessoal."
      - name: ipca_acum
        description: "Índice acumulado (base 1) do IPCA."
      - name: igpm_acum
        description: "Índice acumulado (base 1) do IGP-M."
      - name: selic_acum
        description: "Índice acumulado (base 1) da Selic."
      - name: cdi_acum
        description: "Índice acumulado (base 1) do CDI."

  - name: int_consumo_consolidado
    description: "Une os lançamentos de contas de Lucas e Jéssica (stg_luc_contas e stg_jsc_contas) num único fato de despesas por categoria, ordenado por mês de débito e pessoa."
    columns:
      - name: mes_fatura
        description: "Primeiro dia do mês da fatura em que a despesa foi cobrada."
      - name: mes_debito
        description: "Primeiro dia do mês de débito/competência da despesa."
      - name: data_debito
        description: "Data do débito/lançamento da despesa."
      - name: nome_dia
        description: "Nome do dia da semana da despesa, em maiúsculas."
      - name: dia_ajustado
        description: "Dia ajustado ao ciclo da fatura."
      - name: dia_real
        description: "Dia real do calendário da despesa."
      - name: mercado
        description: "Total gasto na categoria mercado."
      - name: diversos
        description: "Total gasto na categoria diversos."
      - name: assinaturas
        description: "Total gasto na categoria assinaturas."
      - name: role
        description: "Total gasto na categoria rolê/lazer."
      - name: transporte
        description: "Total gasto na categoria transporte."
      - name: apartamento
        description: "Total gasto na categoria apartamento/moradia."
      - name: saude
        description: "Total gasto na categoria saúde."
      - name: educacao
        description: "Total gasto na categoria educação."
      - name: pessoa
        description: "Titular do lançamento (lucas ou jessica)."

  - name: int_dre_consolidado
    description: "Une a consolidação mensal de receitas e despesas de Lucas e Jéssica (stg_luc_consolidado e stg_jsc_consolidado) num único DRE por categoria, ordenado por mês de débito e pessoa."
    columns:
      - name: mes_fatura
        description: "Primeiro dia do mês da fatura de referência."
      - name: mes_debito
        description: "Primeiro dia do mês de débito/competência."
      - name: salario
        description: "Receita de salário no mês."
      - name: dividendos
        description: "Receita de dividendos no mês."
      - name: outros
        description: "Outras receitas no mês."
      - name: receita_total
        description: "Receita total do mês."
      - name: ajuste_realizado
        description: "Ajuste recebido"
      - name: mercado
        description: "Despesa total na categoria mercado."
      - name: diversos
        description: "Despesa total na categoria diversos."
      - name: assinaturas
        description: "Despesa total na categoria assinaturas."
      - name: role
        description: "Despesa total na categoria rolê/lazer."
      - name: transporte
        description: "Despesa total na categoria transporte."
      - name: apartamento
        description: "Despesa total na categoria apartamento/moradia."
      - name: saude
        description: "Despesa total na categoria saúde."
      - name: educacao
        description: "Despesa total na categoria educação."
      - name: despesas_total
        description: "Despesa total do mês."
      - name: resultado
        description: "Resultado do mês (receita total menos despesa total)."
      - name: pessoa
        description: "Titular do consolidado (lucas ou jessica)."

  - name: int_renda_fixa
    description: "Consolida posições de renda fixa (renda fixa B3, tesouro direto, Avenue e faltantes) por mês-base e pessoa, padronizando instituição e somando o valor atualizado."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base da posição."
      - name: pessoa
        description: "Titular da posição (deusa, jessica ou lucas)."
      - name: instituicao
        description: "Corretora/custodiante padronizada (ex.: NUBANK, BRADESCO, DAYCOVAL, AVENUE)."
      - name: emissor
        description: "Instituição emissora do título, normalizada."
      - name: conglomerado
        description: "Conglomerado financeiro FGC do emissor (via de-para)."
      - name: classe_ativo
        description: "Classe do ativo (RENDA FIXA)."
      - name: tipo_ativo
        description: "Tipo do ativo (TÍTULO PÚBLICO ou TÍTULO PRIVADO)."
      - name: ativo
        description: "Nome/identificação do ativo (com ano de vencimento para títulos privados)."
      - name: indexador
        description: "Indexador de rentabilidade (ex.: CDI, IPCA, PREFIXADO)."
      - name: data_emissao
        description: "Data de emissão do título."
      - name: data_vencimento
        description: "Data de vencimento do título."
      - name: vencimento_em_dias
        description: "Dias restantes até o vencimento a partir da data atual (nulo se já vencido)."
      - name: vlr_atualizado_brl
        description: "Valor de mercado atualizado da posição, somado por grupo, em reais."
      - name: moeda_ativo
        description: "Moeda do ativo (BRL)."

  - name: int_renda_variavel
    description: "Consolida posições de renda variável (ações, BDRs, ETFs, fundos e Avenue) por mês-base e pessoa, padronizando instituição e somando o valor atualizado."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base da posição."
      - name: pessoa
        description: "Titular da posição (deusa, jessica ou lucas)."
      - name: instituicao
        description: "Corretora/custodiante padronizada (ex.: NUBANK, BRADESCO, AVENUE)."
      - name: classe_ativo
        description: "Classe do ativo (RENDA VARIAVEL)."
      - name: tipo_ativo
        description: "Tipo do ativo (ACAO ou FUNDO)."
      - name: ativo
        description: "Ticker/identificação do ativo."
      - name: vlr_atualizado_brl
        description: "Valor de mercado atualizado da posição, somado por grupo, em reais."
      - name: moeda_ativo
        description: "Moeda do ativo (BRL)."

  - name: int_renda_passiva
    description: "Consolida a renda passiva (proventos B3 exceto juros e dividendos da Avenue) por mês-base e pessoa, padronizando instituição e somando o valor líquido."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base do recebimento."
      - name: pessoa
        description: "Titular que recebeu a renda passiva (deusa, jessica ou lucas)."
      - name: instituicao
        description: "Instituição pagadora padronizada (ex.: NUBANK, BRADESCO, AVENUE)."
      - name: vlr_liquido_brl
        description: "Valor líquido de proventos/dividendos recebidos no mês, em reais."
      - name: moeda_ativo
        description: "Moeda do valor (BRL ou USD conforme origem)."
