selectors:
  # Finanças nasce de quatro pastas de staging (planilha, B3, Avenue e seeds) e
  # converge para models/{intermediate,marts}/financas.
  # Puxa junto os marts de livros: seeds_sources alimenta dim_datas, que é a
  # dimensão conformada e tem dependentes fora do domínio.
  - name: financas
    definition:
      union:
        - method: path
          value: models/staging/google
          children: true
        - method: path
          value: models/staging/b3
          children: true
        - method: path
          value: models/staging/avenue
          children: true
        - method: path
          value: models/staging/seeds_sources
          children: true
  - name: energia
    definition:
      union:
        - method: path
          value: models/staging/solar
          children: true
        - method: path
          value: models/staging/weather
          children: true
  - name: nhl
    definition:
      method: path
      value: models/staging/nhl
      children: True
  - name: livros
    definition:
      method: path
      value: models/staging/livros
      children: True
  - name: inflation
    definition:
      method: path
      value: models/staging/inflation
      children: True
