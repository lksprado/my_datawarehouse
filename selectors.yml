selectors:
  - name: energia
    definition:
      union:
        - method: path
          value: models/staging/solar
          children: true
        - method: path
          value: models/staging/weather
          children: true
  - name: nhl
    definition:
      method: path
      value: models/staging/nhl
      children: True
  - name: livros
    definition:
      method: path
      value: models/staging/livros
      children: True
  - name: inflation
    definition:
      method: path
      value: models/staging/inflation
      children: True
